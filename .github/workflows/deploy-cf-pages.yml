name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - "home/**"
      - "lib/**"
      - "public/**"
      - "tools/**"
      - "astro.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cf-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "home/**"
      - "lib/**"
      - "public/**"
      - "tools/**"
      - "astro.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cf-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The check runs on every event, including the push to main this repository works on, and the
# deploy waits for it. A change that fails the check therefore never reaches the host.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check types
        run: npx astro check

      - name: Build the site
        run: npm run build

      - name: Assert the llms files
        run: |
          for file in dist/llms.txt dist/llms-full.txt; do
            test -s "$file" || { echo "$file is missing or empty"; exit 1; }
          done

  deploy:
    needs: check
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build the site
        run: npm run build

      # The job that deploys builds its own tree, so the files are asserted here as well.
      - name: Assert the llms files
        run: |
          for file in dist/llms.txt dist/llms-full.txt; do
            test -s "$file" || { echo "$file is missing or empty"; exit 1; }
          done

      # Pinned to the major: an unannounced breaking change in the Wrangler CLI
      # would otherwise take the deploy down with no change on this side.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist/ --project-name=ktema-www
