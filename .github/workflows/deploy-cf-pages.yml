name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cf-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cf-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build the site
        run: npm run build

  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build the site
        run: npm run build

      # Pinned to the major: an unannounced breaking change in the Wrangler CLI
      # would otherwise take the deploy down with no change on this side.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist/ --project-name=ktema-www
