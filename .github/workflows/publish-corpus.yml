name: Publish the corpus

# The corpus is measured elsewhere and assembled here.
#
# A producer repository (private) exports a volume into an artifact and publishes that artifact. This workflow fetches the
# artifact, refuses it unless it matches its own digest, builds the site from it, and publishes the site. The build never
# reaches into a producer's checkout: what crosses is the export and its digest, which is what makes the two repositories
# independent of each other's internals.
#
# The corpus viewer is a cockpit, and its source is a producer's too. It is rebuilt from the cockpit whose artifact is
# published beside the export, and its pages point at the hub this job publishes, so one run leaves the two renderings
# of one corpus in step.

on:
  # A producer publishes an export and asks this to publish it.
  repository_dispatch:
    types: [corpus]
  # The artifact is a public download, so anything can be published from it by naming where it is.
  workflow_dispatch:
    inputs:
      corpus_url:
        description: The published export, as a directory URL
        required: false
        default: https://raw.githubusercontent.com/ktema-systems/corpus-board/main/export
  push:
    branches: ["main"]
    paths:
      - "demo/**"
      - "lib/**"
      - "tools/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-corpus.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CORPUS_URL: ${{ github.event.inputs.corpus_url || 'https://raw.githubusercontent.com/ktema-systems/corpus-board/main/export' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Test the llms module
        run: node --test packages/astro-llms/index.test.mjs

      - name: Check types
        run: npx astro check --root demo

      # The export is the input, so it is taken and checked before anything is built: a corpus that does not match its
      # digest stops the run here rather than becoming a page.
      - name: Take the corpus
        run: npm run corpus:take

      - name: Assert the site is the export
        run: npm run corpus:check

      - name: Build the site
        run: npm run build:demo

      - name: Assert the text files
        run: |
          for file in demo-dist/llms.txt demo-dist/index.md demo-dist/pages.json; do
            test -s "$file" || { echo "$file is missing or empty"; exit 1; }
          done

  publish:
    needs: check
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Take the corpus
        run: npm run corpus:take

      - name: Build the site
        run: npm run build:demo

      # The job that publishes builds its own tree, so the files are asserted here as well.
      - name: Assert the text files
        run: |
          for file in demo-dist/llms.txt demo-dist/index.md demo-dist/pages.json; do
            test -s "$file" || { echo "$file is missing or empty"; exit 1; }
          done

      # Pinned to the major: an unannounced breaking change in the Wrangler CLI would otherwise take the publish down with
      # no change on this side.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy demo-dist/ --project-name=ktema-corpus-hub

      # The cockpit whose board lists these pages. It is built from the cockpit repository's own artifact, and this job
      # only records which export the site it names was built from, so a center a corpus behind says so on its list.
      - name: Report the published digest
        run: |
          digest=$(cat demo/src/data/corpus-digest.txt)
          echo "the site now serves the corpus ${digest}"
          echo "### Corpus ${digest}" >> "$GITHUB_STEP_SUMMARY"
